# ══════════════════════════════════════════════════════════════════════
# LegalBridge — ONE-TIME keystore generator
#
# Run this workflow ONCE to create the release signing keystore.
# After it finishes, download the artifact, copy the base64 string,
# and add it as the KEYSTORE_BASE64 GitHub secret.
#
# Prerequisites — add these three GitHub secrets BEFORE running:
#   KEYSTORE_PASSWORD   (choose any strong password, ≥8 chars)
#   KEY_PASSWORD        (choose any strong password, ≥8 chars)
#   (KEYSTORE_BASE64 does NOT exist yet — that's what this creates)
#
# How to add secrets:
#   GitHub repo → Settings → Secrets and variables → Actions → New secret
#
# How to run this workflow:
#   GitHub repo → Actions → "Generate Release Keystore" → Run workflow → Run
#
# After running:
#   1. Click the completed run → Artifacts → download "keystore-setup"
#   2. Open keystore_base64.txt — copy the ENTIRE content (one long line)
#   3. GitHub → Settings → Secrets → New secret
#      Name: KEYSTORE_BASE64   Value: (paste the long line)
#   4. Done — the build-aab workflow will now sign every AAB automatically.
#
# IMPORTANT: keep the downloaded keystore file safe. If you ever lose
# KEYSTORE_BASE64 you cannot update your Play Store app.
# ══════════════════════════════════════════════════════════════════════
name: Generate Release Keystore (run once)

on:
  workflow_dispatch:   # manual trigger only

jobs:
  generate-keystore:
    name: Generate & export keystore
    runs-on: ubuntu-latest

    steps:
      # ── Java ───────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── Generate keystore ──────────────────────────────────────────
      - name: Generate release keystore
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS:   ${{ secrets.KEY_PASSWORD }}
        run: |
          keytool -genkey -v \
            -keystore release.keystore \
            -alias legalbridge \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=LegalBridge, OU=DST Global Innovative Nigeria Ltd, O=DST Global, L=Akwanga, S=Nasarawa, C=NG" \
            -storepass "${STORE_PASS}" \
            -keypass  "${KEY_PASS}"

      # ── Export as base64 ───────────────────────────────────────────
      - name: Encode keystore as base64
        run: |
          base64 --wrap=0 release.keystore > keystore_base64.txt
          echo "" >> keystore_base64.txt   # ensure trailing newline
          echo "✅ Keystore generated. Download the artifact below."
          echo "   Add keystore_base64.txt content as GitHub secret KEYSTORE_BASE64."

      # ── Write setup instructions alongside the key file ────────────
      - name: Write instructions
        run: |
          cat > NEXT_STEPS.txt << 'EOF'
          LEGALBRIDGE KEYSTORE — NEXT STEPS
          ===================================

          1. Copy the ENTIRE content of keystore_base64.txt (one long line).

          2. Go to your GitHub repo:
             Settings → Secrets and variables → Actions → New repository secret
             Name:  KEYSTORE_BASE64
             Value: (paste the base64 string)
             Click "Add secret".

          3. The build-aab.yml workflow will now automatically sign every AAB.

          4. KEEP THIS FILE SAFE — store keystore_base64.txt and your passwords
             in a password manager. You cannot update your Play Store app without
             the original keystore.

          Your secrets needed for future builds:
            KEYSTORE_BASE64   → content of keystore_base64.txt  (add to GitHub now)
            KEYSTORE_PASSWORD → the password you set as a secret (already in GitHub)
            KEY_PASSWORD      → the password you set as a secret (already in GitHub)
          EOF
          echo "Instructions written to NEXT_STEPS.txt"

      # ── Upload artifact (expires in 1 day — download immediately) ──
      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore-setup
          path: |
            keystore_base64.txt
            NEXT_STEPS.txt
          retention-days: 1   # short TTL — this contains a signing secret
