# ══════════════════════════════════════════════════════════════════════
# LegalBridge — ONE-TIME keystore generator
#
# Run this workflow ONCE to create the release signing keystore.
# After it finishes, download the artifact, copy the base64 string,
# and add it as the KEYSTORE_BASE64 GitHub secret.
#
# Prerequisites — add this ONE secret before running:
#   KEYSTORE_PASSWORD   (your chosen signing password, e.g. LBRelease2026!)
#
# NOTE: KEY_PASSWORD is NOT used. In PKCS12 (the Java 9+ default keystore
# format), there is only ONE password — the store password. The private key
# is stored in an encrypted SafeBag whose encryption key IS the store
# password. There is no separate key password in PKCS12.
#
# How to run:
#   GitHub repo → Actions → "Generate Release Keystore (run once)"
#   → Run workflow → Run workflow
#
# After running:
#   1. Click the completed run → Artifacts → download "keystore-setup"
#   2. Open keystore_base64.txt — copy the ENTIRE content (one long line)
#   3. GitHub → Settings → Secrets → New repository secret
#      Name: KEYSTORE_BASE64   Value: (paste the long base64 line)
#   4. Done. The build-aab workflow uses KEYSTORE_PASSWORD + KEYSTORE_BASE64
#      to sign every AAB automatically.
#
# IMPORTANT: store keystore_base64.txt and KEYSTORE_PASSWORD in a password
# manager. Without the original keystore you cannot update your Play Store app.
# ══════════════════════════════════════════════════════════════════════
name: Generate Release Keystore (run once)

on:
  workflow_dispatch:   # manual trigger only

jobs:
  generate-keystore:
    name: Generate & export keystore
    runs-on: ubuntu-latest

    steps:
      # ── Java 21 ────────────────────────────────────────────────────
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # ── Generate PKCS12 keystore ───────────────────────────────────
      # We explicitly set -storetype PKCS12 (same as the Java 21 default).
      # -keypass is set equal to -storepass because PKCS12 enforces a single
      # password for the whole store. Passing a different value would be
      # silently overridden by the JDK anyway.
      - name: Generate release keystore
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -genkey -v \
            -keystore release.keystore \
            -alias legalbridge \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storetype PKCS12 \
            -dname "CN=LegalBridge, OU=DST Global Innovative Nigeria Ltd, O=DST Global, L=Akwanga, S=Nasarawa, C=NG" \
            -storepass "${STORE_PASS}" \
            -keypass  "${STORE_PASS}"
          echo "✅ Keystore generated ($(wc -c < release.keystore) bytes)"

      # ── Self-test ──────────────────────────────────────────────────
      # Verify the keystore is valid and the alias is readable using the
      # store password. keytool -list -v is the correct verification for
      # PKCS12. We do NOT use -keypasswd here — that command does not exist
      # for PKCS12 and throws UnsupportedOperationException.
      - name: Verify keystore is readable
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -list -v \
            -keystore release.keystore \
            -alias legalbridge \
            -storepass "${STORE_PASS}" \
            -noprompt
          echo "✅ Keystore verified — alias 'legalbridge' is readable with KEYSTORE_PASSWORD"

      # ── Encode as base64 for GitHub Secrets ───────────────────────
      - name: Encode keystore as base64
        run: |
          base64 --wrap=0 release.keystore > keystore_base64.txt
          echo "" >> keystore_base64.txt
          echo "✅ Encoded to keystore_base64.txt"

      # ── Instructions file ──────────────────────────────────────────
      - name: Write next-steps instructions
        run: |
          cat > NEXT_STEPS.txt << 'EOF'
LEGALBRIDGE KEYSTORE — NEXT STEPS
===================================

1. Copy the ENTIRE content of keystore_base64.txt (it is one long line).

2. Go to your GitHub repo:
   Settings → Secrets and variables → Actions → New repository secret
   Name:  KEYSTORE_BASE64
   Value: (paste the base64 string — the whole line, no line breaks)
   Click "Add secret".

3. That's it. Every push to main now builds and signs the AAB automatically.
   Download the AAB from Actions → run → Artifacts.

SECRETS SUMMARY
  KEYSTORE_BASE64    → add now (content of keystore_base64.txt)
  KEYSTORE_PASSWORD  → already in GitHub (used to open the keystore)
  KEY_PASSWORD       → not used (PKCS12 has only one password)

IMPORTANT: Save keystore_base64.txt somewhere safe (password manager).
You cannot update your Play Store listing without this keystore.
EOF
          echo "✅ NEXT_STEPS.txt written"

      # ── Upload artifact ────────────────────────────────────────────
      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore-setup
          path: |
            keystore_base64.txt
            NEXT_STEPS.txt
          retention-days: 1   # short TTL — treat this as a secret
