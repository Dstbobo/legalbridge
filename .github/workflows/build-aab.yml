# ══════════════════════════════════════════════════════════════════════
# LegalBridge — Android AAB build & sign
#
# Triggers: every push to main, or manually via workflow_dispatch.
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64     base64-encoded release.keystore
#                       (generated by the generate-keystore workflow)
#   KEYSTORE_PASSWORD   keystore store password
#   KEY_PASSWORD        key password
#
# Output: signed AAB downloadable from Actions → run → Artifacts
#         File: legalbridge-v{versionName}-{YYYYMMDD}.aab
#         Retained for 30 days. Download and upload to Google Play.
# ══════════════════════════════════════════════════════════════════════
name: Build Android AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel any in-progress build for the same branch when a new push lands.
concurrency:
  group: build-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & sign AAB
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ───────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Java 17 ───────────────────────────────────────────────────
      # AGP 8.x requires Java 17; ubuntu-latest ships 17 but we pin it
      # explicitly so the toolchain is reproducible.
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # ── Node.js ───────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── Install JS dependencies ────────────────────────────────────
      - name: Install npm dependencies
        run: npm ci

      # ── Capacitor sync ────────────────────────────────────────────
      # Copies capacitor.config.json into android/app/src/main/assets
      # and runs any Capacitor plugin install hooks.
      - name: Sync Capacitor to Android
        run: npx cap sync android

      # ── Signing keystore ──────────────────────────────────────────
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set."
            echo "::error::Run the 'Generate Release Keystore' workflow first,"
            echo "::error::then add the output as a GitHub secret."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/release.keystore
          echo "✅ Keystore decoded ($(wc -c < android/release.keystore) bytes)"

      - name: Write keystore.properties
        run: |
          cat > android/keystore.properties << EOF
          storeFile=release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=legalbridge
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          echo "✅ keystore.properties written"

      # ── Gradle build ──────────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon --stacktrace
        env:
          # Tell Gradle where the Android SDK is on the runner.
          # ubuntu-latest has the SDK pre-installed at this path.
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      # ── Derive version name for the artifact filename ──────────────
      - name: Get version name
        id: version
        run: |
          VERSION=$(grep 'versionName' android/app/build.gradle | head -1 | grep -o '"[^"]*"' | tr -d '"')
          echo "name=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "date=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      # ── Upload artifact ────────────────────────────────────────────
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: legalbridge-v${{ steps.version.outputs.name }}-${{ steps.version.outputs.date }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error

      # ── Build summary ──────────────────────────────────────────────
      - name: Print build summary
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          SIZE=$(du -sh "$AAB" | cut -f1)
          echo "## ✅ AAB built successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| File | app-release.aab |" >> $GITHUB_STEP_SUMMARY
          echo "| Size | ${SIZE} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.version.outputs.name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Built | ${{ steps.version.outputs.date }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the artifact from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
          echo "Upload directly to Google Play Console → Production → Create new release." >> $GITHUB_STEP_SUMMARY
