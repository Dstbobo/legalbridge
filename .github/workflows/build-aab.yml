# ══════════════════════════════════════════════════════════════════════
# LegalBridge — Android AAB build & sign
#
# Triggers: every push to main, or manually via workflow_dispatch.
#
# Required GitHub secrets:
#   KEYSTORE_BASE64     base64-encoded release.keystore
#                       (generated by the generate-keystore workflow)
#   KEYSTORE_PASSWORD   the password used when the keystore was created
#
# NOTE: KEY_PASSWORD is NOT required. The keystore is PKCS12 format
# (Java 9+ default). PKCS12 has a single password that protects both the
# store and every key entry inside it. Gradle receives KEYSTORE_PASSWORD
# for both store.password and key.password.
#
# Output: signed AAB downloadable from Actions → run → Artifacts
#         Retained for 30 days. Upload directly to Google Play Console.
# ══════════════════════════════════════════════════════════════════════
name: Build Android AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel any in-progress build for the same branch when a new push lands.
concurrency:
  group: build-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & sign AAB
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ───────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Java 21 ────────────────────────────────────────────────────
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # ── Node.js 22 ────────────────────────────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ── Install JS dependencies ────────────────────────────────────
      - name: Install npm dependencies
        run: npm ci

      # ── Capacitor sync ────────────────────────────────────────────
      - name: Sync Capacitor to Android
        run: npx cap sync android

      # ── Decode keystore ───────────────────────────────────────────
      # Decode KEYSTORE_BASE64 → android/release.keystore, then verify
      # it is readable using KEYSTORE_PASSWORD.
      #
      # Verification uses: keytool -list -v -alias legalbridge
      # This is the correct check for PKCS12. It opens the keystore with
      # the store password and reads the key entry — if either the file or
      # the password is wrong, keytool exits non-zero and the step fails.
      #
      # We do NOT use keytool -keypasswd — that command is JKS-only and
      # throws UnsupportedOperationException on PKCS12 keystores.
      - name: Decode and verify keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set."
            echo "::error::Run the 'Generate Release Keystore' workflow first, then add the"
            echo "::error::keystore_base64.txt content as the KEYSTORE_BASE64 secret."
            exit 1
          fi

          # Decode — tr -d strips any whitespace or newlines introduced
          # during copy-paste into the GitHub Secrets UI.
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android/release.keystore
          BYTES=$(wc -c < android/release.keystore)
          echo "Keystore decoded: ${BYTES} bytes"

          if [ "$BYTES" -lt 100 ]; then
            echo "::error::Decoded keystore is only ${BYTES} bytes — KEYSTORE_BASE64 is corrupted."
            echo "::error::Re-run 'Generate Release Keystore' and update KEYSTORE_BASE64."
            exit 1
          fi

          # Verify the keystore is readable with the store password.
          # keytool -list -v reads the alias entry from the PKCS12 SafeBag,
          # which requires decrypting with the store password. Exits non-zero
          # if the password is wrong or the alias does not exist.
          if keytool -list -v \
               -keystore android/release.keystore \
               -alias legalbridge \
               -storepass "${STORE_PASS}" \
               -noprompt > /dev/null 2>&1; then
            echo "✅ Keystore verified — KEYSTORE_PASSWORD is correct, alias 'legalbridge' exists"
          else
            echo "::error::Keystore verification failed."
            echo "::error::Either KEYSTORE_PASSWORD is wrong, or KEYSTORE_BASE64 does not match"
            echo "::error::the password currently stored as KEYSTORE_PASSWORD."
            echo "::error::Fix: re-run 'Generate Release Keystore' and update KEYSTORE_BASE64."
            exit 1
          fi

      # ── Gradle build & sign ────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release AAB
        working-directory: android
        # AGP injected signing properties pass the credentials directly to
        # Gradle without writing them to any file — safe for special chars.
        #
        # PKCS12 signing: both store.password and key.password must be the
        # same value (KEYSTORE_PASSWORD). PKCS12 enforces a single password
        # for the whole keystore including every key entry inside it.
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          STORE_FILE: ${{ github.workspace }}/android/release.keystore
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          ./gradlew bundleRelease --no-daemon \
            "-Pandroid.injected.signing.store.file=${STORE_FILE}" \
            "-Pandroid.injected.signing.store.password=${STORE_PASS}" \
            "-Pandroid.injected.signing.key.alias=legalbridge" \
            "-Pandroid.injected.signing.key.password=${STORE_PASS}"

      # ── Artifact ───────────────────────────────────────────────────
      - name: Get version name
        id: version
        run: |
          VERSION=$(grep 'versionName' android/app/build.gradle | head -1 | grep -o '"[^"]*"' | tr -d '"')
          echo "name=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "date=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: legalbridge-v${{ steps.version.outputs.name }}-${{ steps.version.outputs.date }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error

      # ── Build summary ──────────────────────────────────────────────
      - name: Print build summary
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          SIZE=$(du -sh "$AAB" | cut -f1)
          echo "## ✅ AAB built successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| File | app-release.aab |" >> $GITHUB_STEP_SUMMARY
          echo "| Size | ${SIZE} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.version.outputs.name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Built | ${{ steps.version.outputs.date }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download from **Artifacts** above → upload to Google Play Console." >> $GITHUB_STEP_SUMMARY
