# ══════════════════════════════════════════════════════════════════════
# LegalBridge — Android AAB build & sign
#
# Triggers: every push to main, or manually via workflow_dispatch.
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64     base64-encoded release.keystore
#                       (generated by the generate-keystore workflow)
#   KEYSTORE_PASSWORD   keystore store password
#   KEY_PASSWORD        key password
#
# Output: signed AAB downloadable from Actions → run → Artifacts
#         File: legalbridge-v{versionName}-{YYYYMMDD}.aab
#         Retained for 30 days. Download and upload to Google Play.
# ══════════════════════════════════════════════════════════════════════
name: Build Android AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel any in-progress build for the same branch when a new push lands.
concurrency:
  group: build-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & sign AAB
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ───────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Java 17 ───────────────────────────────────────────────────
      # AGP 8.x requires Java 17; ubuntu-latest ships 17 but we pin it
      # explicitly so the toolchain is reproducible.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # ── Node.js ───────────────────────────────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ── Install JS dependencies ────────────────────────────────────
      - name: Install npm dependencies
        run: npm ci

      # ── Capacitor sync ────────────────────────────────────────────
      # Copies capacitor.config.json into android/app/src/main/assets
      # and runs any Capacitor plugin install hooks.
      - name: Sync Capacitor to Android
        run: npx cap sync android

      # ── Signing keystore ──────────────────────────────────────────
      # We use Android Gradle Plugin's injected signing properties
      # (-Pandroid.injected.signing.*) rather than a keystore.properties
      # file. This avoids every quoting / Java-Properties-escaping issue
      # that special characters in passwords (! @ # etc.) can cause.
      # The keystore is decoded here; passwords stay as env vars and are
      # passed directly to Gradle on the command line below.
      - name: Decode and verify keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS:   ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set. Run 'Generate Release Keystore' first."
            exit 1
          fi

          # Decode (strip whitespace to survive copy-paste line-wrapping)
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android/release.keystore
          BYTES=$(wc -c < android/release.keystore)
          echo "Keystore size: ${BYTES} bytes"
          if [ "$BYTES" -lt 100 ]; then
            echo "::error::Decoded keystore is ${BYTES} bytes — KEYSTORE_BASE64 is corrupted."
            exit 1
          fi

          # --- Verify store password ---
          if keytool -list \
               -keystore android/release.keystore \
               -storepass "${STORE_PASS}" \
               -noprompt > /dev/null 2>&1; then
            echo "✅ Store password (KEYSTORE_PASSWORD) is correct"
          else
            echo "::error::KEYSTORE_PASSWORD does not match the keystore."
            echo "::error::Re-run 'Generate Release Keystore' workflow and update KEYSTORE_BASE64."
            exit 1
          fi

          # --- Verify key password by exporting the certificate (needs key access) ---
          if keytool -exportcert \
               -keystore android/release.keystore \
               -storepass "${STORE_PASS}" \
               -alias legalbridge \
               -noprompt > /dev/null 2>&1; then
            # exportcert works with store password on PKCS12; now verify key password
            # by attempting a key password change to itself (no-op if correct)
            if keytool -keypasswd \
                 -keystore android/release.keystore \
                 -alias legalbridge \
                 -storepass "${STORE_PASS}" \
                 -keypass "${KEY_PASS}" \
                 -new "${KEY_PASS}" \
                 -noprompt > /dev/null 2>&1; then
              echo "✅ Key password (KEY_PASSWORD) is correct"
            else
              echo "::error::KEY_PASSWORD does not match the key in the keystore."
              echo "::error::This is the most common cause of 'BadPaddingException' in Gradle."
              echo "::error::Fix: re-run 'Generate Release Keystore' workflow, download the"
              echo "::error::new artifact, and update the KEYSTORE_BASE64 secret."
              exit 1
            fi
          fi

      # ── Gradle build ──────────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release AAB
        working-directory: android
        # Pass signing credentials as AGP injected properties — this is the
        # standard CI pattern and avoids every .properties file quoting issue.
        # Passwords are passed via env vars (never interpolated directly into
        # the shell command string) so special characters like ! are safe.
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          STORE_FILE: ${{ github.workspace }}/android/release.keystore
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS:   ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --no-daemon \
            "-Pandroid.injected.signing.store.file=${STORE_FILE}" \
            "-Pandroid.injected.signing.store.password=${STORE_PASS}" \
            "-Pandroid.injected.signing.key.alias=legalbridge" \
            "-Pandroid.injected.signing.key.password=${KEY_PASS}"

      # ── Derive version name for the artifact filename ──────────────
      - name: Get version name
        id: version
        run: |
          VERSION=$(grep 'versionName' android/app/build.gradle | head -1 | grep -o '"[^"]*"' | tr -d '"')
          echo "name=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "date=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      # ── Upload artifact ────────────────────────────────────────────
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: legalbridge-v${{ steps.version.outputs.name }}-${{ steps.version.outputs.date }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error

      # ── Build summary ──────────────────────────────────────────────
      - name: Print build summary
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          SIZE=$(du -sh "$AAB" | cut -f1)
          echo "## ✅ AAB built successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| File | app-release.aab |" >> $GITHUB_STEP_SUMMARY
          echo "| Size | ${SIZE} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.version.outputs.name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Built | ${{ steps.version.outputs.date }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the artifact from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
          echo "Upload directly to Google Play Console → Production → Create new release." >> $GITHUB_STEP_SUMMARY
