name: Security CI

on:
  pull_request:
  push:
    branches:
      - security/legalbridge-auth-boundary

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install API dependencies
        run: python -m pip install -r api/requirements.txt pip-audit
      - name: Run backend tests
        working-directory: api
        run: python -m pytest -q
      - name: Audit Python dependencies
        run: python -m pip_audit -r api/requirements.txt

  edge-and-mobile:
    name: Edge and mobile security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Audit root dependencies
        run: npm audit --audit-level=high
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Run Edge Function security tests
        run: node --test supabase/functions/_shared/*.test.ts
      - name: Run mobile regression tests
        working-directory: mobile
        run: npm test
      - name: Type-check mobile
        working-directory: mobile
        run: npm run typecheck
      - name: Lint mobile
        working-directory: mobile
        run: npm run lint
      - name: Capture mobile dependency audit
        working-directory: mobile
        run: npm audit --json > "$RUNNER_TEMP/mobile-audit.json" || true
      - name: Enforce reviewed mobile audit policy
        run: node scripts/check-mobile-audit.mjs "$RUNNER_TEMP/mobile-audit.json"

  database:
    name: Ephemeral migration replay and pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start isolated Supabase services
        run: supabase start
      - name: Replay all migrations from zero
        run: supabase db reset
      - name: Run database security tests
        run: supabase test db
      - name: Stop isolated Supabase services
        if: always()
        run: supabase stop --no-backup

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
