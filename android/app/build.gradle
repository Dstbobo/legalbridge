apply plugin: 'com.android.application'

android {
    namespace = "ng.legalbridge.app"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "ng.legalbridge.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // ── Signing ────────────────────────────────────────────────────────
    // Credentials are injected by CI via Android Gradle Plugin standard
    // properties (android.injected.signing.*) passed as -P flags on the
    // Gradle command line. No keystore.properties file is used — this
    // avoids every quoting / character-escaping problem that .properties
    // files cause with passwords containing special characters (!@#$ etc).
    //
    // For local builds, set the four properties in your personal
    // ~/.gradle/gradle.properties file (never commit that file):
    //
    //   LEGALBRIDGE_STORE_FILE=/absolute/path/to/release.keystore
    //   LEGALBRIDGE_STORE_PASS=YourPassword
    //   LEGALBRIDGE_KEY_ALIAS=legalbridge
    //   LEGALBRIDGE_KEY_PASS=YourPassword
    //
    // Then build with:
    //   ./gradlew bundleRelease \
    //     -Pandroid.injected.signing.store.file=$LEGALBRIDGE_STORE_FILE \
    //     -Pandroid.injected.signing.store.password=$LEGALBRIDGE_STORE_PASS \
    //     -Pandroid.injected.signing.key.alias=$LEGALBRIDGE_KEY_ALIAS \
    //     -Pandroid.injected.signing.key.password=$LEGALBRIDGE_KEY_PASS
    //
    // CI passes these automatically — see .github/workflows/build-aab.yml.

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // Required for AAB submission to Google Play
    bundle {
        language { enableSplit = true }
        density  { enableSplit = true }
        abi      { enableSplit = true }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied.")
}
